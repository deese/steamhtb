<!doctype html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Steam × HowLongToBeat Library{% endblock %}</title>
  <!-- No DOM snapshots for back/forward: the server re-renders the page with
       the filters from the URL (a snapshot would show stale form values). -->
  <meta name="htmx-config" content='{"historyCacheSize": 0}' />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            steam: {
              bg: "#0f1621",
              panel: "#1b2838",
              card: "#16202d",
              line: "#24344a",
              accent: "#66c0f4",
              accent2: "#a4d007",
            },
          },
        },
      },
    };
  </script>
  <style>
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #0f1621; }
    ::-webkit-scrollbar-thumb { background: #2a3f5a; border-radius: 6px; }
    .st-btn { font-size: 11px; padding: 1px 8px; border-radius: 4px; border: 1px solid #24344a; color: #94a3b8; }
    .st-btn:hover { color: #e2e8f0; border-color: #66c0f4; }
    .st-btn.on-finished { background: rgba(21,128,61,.35); border-color: #16a34a; color: #bbf7d0; }
    .st-btn.on-abandoned { background: rgba(185,28,28,.3); border-color: #dc2626; color: #fecaca; }
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="h-full min-h-screen bg-steam-bg text-slate-200 antialiased">
  {% if login_enabled %}
  <form method="post" action="/logout" class="fixed top-2 right-2 z-50">
    <button type="submit" class="text-[11px] text-slate-500 hover:text-red-400 bg-steam-panel/80 border border-steam-line rounded px-2 py-1">
      Salir
    </button>
  </form>
  {% endif %}
  {% block content %}{% endblock %}
</body>
</html>
