<div id="hltb-row-{{ game.appid }}" x-data="{ open: false }" class="bg-steam-panel/50 border border-steam-line rounded-lg p-3">
  <div class="flex items-center gap-3">
    <img src="{{ game.header_image }}" alt="" loading="lazy" class="w-20 aspect-[460/215] object-cover rounded bg-steam-bg shrink-0" />
    <div class="flex-1 min-w-0">
      <p class="font-medium text-slate-100 truncate">{{ game.name }}</p>
      <p class="text-xs text-slate-500">{{ "%.0f"|format(game.playtime_minutes / 60) }}h jugadas en Steam</p>
    </div>
    <div class="flex gap-2 shrink-0">
      <button
        type="button"
        @click="open = !open; if (open) htmx.trigger($refs.hltbQuery_{{ game.appid }}, 'search-now')"
        class="text-xs px-2 py-1.5 rounded border border-steam-line hover:border-steam-accent hover:text-steam-accent transition"
      >
        <span x-text="open ? 'Cerrar' : 'Buscar en HLTB'"></span>
      </button>
      <button
        hx-post="/admin/hltb/unavailable"
        hx-vals='{"appid": {{ game.appid }}, "value": "true"}'
        hx-target="#hltb-row-{{ game.appid }}"
        hx-swap="delete"
        hx-confirm="¿Marcar &quot;{{ game.name }}&quot; como no disponible en HowLongToBeat?"
        class="text-xs px-2 py-1.5 rounded border border-red-800 text-red-300 hover:border-red-500 transition"
      >
        No disponible
      </button>
    </div>
  </div>

  <div x-show="open" x-cloak class="mt-3 pt-3 border-t border-steam-line">
    <input
      type="text"
      name="q"
      x-ref="hltbQuery_{{ game.appid }}"
      value="{{ game.name }}"
      hx-get="/admin/hltb/search"
      hx-vals='{"appid": {{ game.appid }}}'
      hx-target="#hltb-results-{{ game.appid }}"
      hx-swap="innerHTML"
      hx-trigger="keyup changed delay:400ms, search-now"
      class="w-full bg-steam-bg border border-steam-line rounded px-2 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-steam-accent"
      placeholder="Buscar título en HowLongToBeat..."
    />
    <div id="hltb-results-{{ game.appid }}" class="mt-2 space-y-1"></div>
  </div>
</div>
